<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuis ASAS Genap VB.Net</title>
    <style>
        /* --- CSS STYLING --- */
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --success-color: #2ecc71;
            --wrong-color: #e74c3c;
            --bg-color: #f5f7fa;
            --card-color: #ffffff;
            --text-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .quiz-container {
            background-color: var(--card-color);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 700px;
            padding: 30px;
            transition: all 0.3s ease;
        }

        .quiz-header {
            border-bottom: 2px solid #eaeded;
            padding-bottom: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .quiz-header h1 {
            font-size: 20px;
            color: var(--primary-color);
        }

        .progress {
            font-size: 14px;
            font-weight: bold;
            color: var(--secondary-color);
            background-color: #e8f4fd;
            padding: 5px 12px;
            border-radius: 20px;
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        pre {
            background-color: #2d3748;
            color: #f7fafc;
            padding: 12px;
            border-radius: 6px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            overflow-x: auto;
            margin: 10px 0 20px 0;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .option-btn {
            background-color: #fff;
            border: 2px solid #dcdde1;
            border-radius: 8px;
            padding: 14px 20px;
            text-align: left;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            display: block;
        }

        .option-btn:hover:not([disabled]) {
            border-color: var(--secondary-color);
            background-color: #f7f9fa;
        }

        .option-btn.correct {
            background-color: #d4edda !important;
            border-color: var(--success-color) !important;
            color: #155724;
            font-weight: 600;
        }

        .option-btn.wrong {
            background-color: #f8d7da !important;
            border-color: var(--wrong-color) !important;
            color: #721c24;
        }

        .rationale-box {
            background-color: #eec15c2b;
            border-left: 4px solid #f1c40f;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .quiz-footer {
            display: flex;
            justify-content: flex-end;
        }

        .next-btn {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .next-btn:hover {
            background-color: #2980b9;
        }

        .next-btn:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        /* Result View */
        .result-view {
            text-align: center;
            display: none;
        }

        .result-view h2 {
            font-size: 28px;
            margin-bottom: 15px;
            color: var(--primary-color);
        }

        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background-color: var(--secondary-color);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
            margin: 20px auto;
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.4);
        }

        .restart-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <div id="quiz-box">
            <div class="quiz-header">
                <h1 id="quiz-title">Latihan ASAS Genap VB.Net</h1>

            <button class="restart-btn" onclick="restartQuiz()">Coba Lagi</button>
        </div>
    </div>

        let currentQuestionIndex = 0;
        let score = 0;

        const questionCloud = document.getElementById("question-cloud");
        const optionsCloud = document.getElementById("options-cloud");
        const progressText = document.getElementById("progress-text");
        const nextButton = document.getElementById("next-button");
        const rationaleCloud = document.getElementById("rationale-cloud");
        const rationaleText = document.getElementById("rationale-text");
        const quizBox = document.getElementById("quiz-box");
        const resultBox = document.getElementById("result-box");
        const scoreText = document.getElementById("score-text");
        const summaryText = document.getElementById("summary-text");

        // Fungsi Memulai Kuis
        function startQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            quizBox.style.display = "block";
            resultBox.style.display = "none";
            nextButton.addEventListener("click", handleNextButton);
            showQuestion();
        }

        // Fungsi Menampilkan Soal ke UI
        function showQuestion() {
            resetState();
            let currentQuestion = quizData[currentQuestionIndex];
            progressText.innerText = `Soal ${currentQuestionIndex + 1} dari ${quizData.length}`;
            questionCloud.innerText = currentQuestion.question;

            // Generate opsi pilihan jawaban
            currentQuestion.options.forEach((option, index) => {
                const button = document.createElement("button");
                button.innerText = `${String.fromCharCode(65 + index)}. ${option}`; // Label A, B, C, D
                button.classList.add("option-btn");
                button.addEventListener("click", () => selectOption(index, button));
                optionsCloud.appendChild(button);
            });
        }

        // Reset Tampilan Tiap Pindah Soal
        function resetState() {
            nextButton.disabled = true;
            rationaleCloud.style.display = "none";
            while (optionsCloud.firstChild) {
                optionsCloud.removeChild(optionsCloud.firstChild);
            }
        }

        // Fungsi Ketika Salah Satu Opsi Diklik
        function selectOption(selectedIndex, clickedButton) {
            const currentQuestion = quizData[currentQuestionIndex];
            const correctIndex = currentQuestion.correct;
            const allButtons = optionsCloud.querySelectorAll(".option-btn");

            // Matikan semua tombol agar tidak bisa klik dua kali
            allButtons.forEach(btn => btn.disabled = true);

            if (selectedIndex === correctIndex) {
                clickedButton.classList.add("correct");
                score++;
            } else {
                clickedButton.classList.add("wrong");
                // Tampilkan letak jawaban yang benar
                allButtons[correctIndex].classList.add("correct");
            }

            // Tampilkan Pembahasan Khusus Soal Tersebut
            rationaleText.innerText = currentQuestion.rationale;
            rationaleCloud.style.display = "block";

            nextButton.disabled = false;
        }

        // Fungsi Navigasi Tombol Lanjut / Selesai
        function handleNextButton() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        // Fungsi Menampilkan Hasil Akhir Skor Ujian
        function showResult() {
            quizBox.style.display = "none";
            resultBox.style.display = "block";
            
            // Konversi nilai mentah menjadi skala 100
            let finalScore = Math.round((score / quizData.length) * 100);
            scoreText.innerText = finalScore;
            summaryText.innerText = `Kamu berhasil menjawab benar ${score} dari ${quizData.length} soal.`;
        }

        // Fungsi Mengulang Kuis Kembali
        function restartQuiz() {
            startQuiz();
        }

        // Jalankan kuis pertama kali saat halaman dimuat
        startQuiz();
    </script>
</body>
</html>
